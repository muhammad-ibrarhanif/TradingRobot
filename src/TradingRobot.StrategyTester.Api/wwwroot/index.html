<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strategy Tester</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; }
  header { padding: 12px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #21262d; }
  input, button { padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; }
  button { cursor: pointer; }
  #chart { width: 100%; height: 520px; }
  #stats { padding: 10px 20px; font-size: 13px; border-collapse: collapse; }
  #stats th, #stats td { padding: 4px 16px 4px 0; text-align: left; }
  #stats th { color: #8b949e; font-weight: normal; }
  #strategy-picker { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #c9d1d9; }
  #strategy-picker label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<header>
  <input id="symbol" value="BTCUSDT" />
  <input id="interval" value="1h" />
  <input id="from" type="date" value="2025-01-01" />
  <input id="to" type="date" value="2025-06-01" />
  <!-- Pick one strategy to test on its own, or several to compare side by side —
       independent of whichever strategies happen to be enabled for live signal
       generation elsewhere. Populated from GET /api/strategies, not hardcoded, so
       adding a new IStrategy to Program.cs shows up here automatically. -->
  <span id="strategy-picker"></span>
  <button onclick="runBacktest()">Run Backtest</button>
</header>
<table id="stats"></table>
<div id="chart"></div>

<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout: { background: { color: '#0d1117' }, textColor: '#c9d1d9' },
  grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
});
const candleSeries = chart.addCandlestickSeries();

// One color per strategy so overlaid markers from different strategies running
// against the same history stay visually distinguishable on the chart.
const strategyColors = ['#3fb950', '#f85149', '#58a6ff', '#d29922', '#bc8cff'];

// Populate the strategy checkboxes from whatever's actually registered in this
// service, rather than hardcoding names here — stays correct as strategies are
// added/removed in Program.cs. All start checked (same as the old "always run
// everything" behavior) so nothing changes for anyone who doesn't touch this.
async function loadStrategyPicker() {
  const res = await fetch('/api/strategies');
  const names = await res.json();
  const picker = document.getElementById('strategy-picker');
  picker.innerHTML = names.map(name => `
    <label><input type="checkbox" value="${name}" checked /> ${name}</label>
  `).join('');
}

function selectedStrategyNames() {
  return Array.from(document.querySelectorAll('#strategy-picker input:checked')).map(cb => cb.value);
}

async function runBacktest() {
  const symbol = document.getElementById('symbol').value;
  const interval = document.getElementById('interval').value;
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;

  const selected = selectedStrategyNames();
  if (selected.length === 0) {
    alert('Pick at least one strategy to test.');
    return;
  }
  const strategiesParam = encodeURIComponent(selected.join(','));

  const res = await fetch(`/api/backtest?symbol=${symbol}&interval=${interval}&from=${from}&to=${to}&strategies=${strategiesParam}`);
  const results = await res.json(); // one BacktestResult per selected strategy

  if (!results.length) return;

  // Candles are identical across every result (same historical data) — only
  // need to plot them once.
  candleSeries.setData(results[0].candles.map(c => ({
    time: Math.floor(new Date(c.openTime).getTime() / 1000),
    open: c.open, high: c.high, low: c.low, close: c.close,
  })));

  // Merge trade markers from every strategy onto the same chart, tagging each
  // with its strategy name and a per-strategy color so they don't blur together.
  const markers = results.flatMap((result, i) => result.trades.map(t => ({
    time: Math.floor(new Date(t.time).getTime() / 1000),
    position: t.side === 0 ? 'belowBar' : 'aboveBar',
    color: strategyColors[i % strategyColors.length],
    shape: t.side === 0 ? 'arrowUp' : 'arrowDown',
    text: `${result.strategyName}: ${t.side === 0 ? 'BUY' : 'SELL'}`,
  }))).sort((a, b) => a.time - b.time);
  candleSeries.setMarkers(markers);

  document.getElementById('stats').innerHTML = `
    <tr><th>Strategy</th><th>Return</th><th>Trades</th><th>Win rate</th></tr>
    ${results.map((r, i) => `
      <tr style="color:${strategyColors[i % strategyColors.length]}">
        <td>${r.strategyName}</td>
        <td>${r.returnPct.toFixed(2)}%</td>
        <td>${r.totalTrades}</td>
        <td>${r.winRatePct.toFixed(1)}%</td>
      </tr>`).join('')}
  `;
}

loadStrategyPicker();
</script>
</body>
</html>
